[tool.poetry]
name = "camrand"
version = "0.1.0"
description = "A simple webapp which generates true randomness using a webcam"
authors = ["Pop101 <leon@leibmann.org>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
Pillow = ">=10.0.1"
flask = ">=2.2.2"
cython = ">=3.0"
waitress = ">=2.0"
numpy = ">=1.26,<3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
